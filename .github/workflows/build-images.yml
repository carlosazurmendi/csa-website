name: build-images

# Builds the app + init images OFF-box (GH runners have ~16 GB — no OOM) and pushes
# them to GHCR. dockhand only PULLS these; the production box never builds.
#
#   ghcr.io/<owner>/csa-website        (runner stage)  -> the app
#   ghcr.io/<owner>/csa-website-init   (builder stage) -> migrate + seed job
#
# Tags: `latest` on the default branch, `sha-<short>` always (pin IMAGE_TAG to a sha
# in dockhand for immutable deploys), and the tag name on a `v*` tag push.
#
# Deploys are automatic on main: after both images push, the `deploy` job POSTs to
# the dockhand stack webhook (DOCKHAND_WEBHOOK_URL / DOCKHAND_WEBHOOK_SECRET repo
# secrets), signed GitHub-style — X-Hub-Signature-256 = HMAC-SHA256 of the raw
# body — so the secret itself never leaves the runner. dockhand verifies and
# redeploys the stack, pulling the fresh images. Tag (`v*`) builds do NOT deploy:
# they exist to pin IMAGE_TAG manually.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- app image (final `runner` stage) ----
      - name: Metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # ---- init image (`builder` stage: Payload CLI + src + pg for migrate/seed) ----
      - name: Metadata (init)
        id: meta-init
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-init
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build & push init
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ steps.meta-init.outputs.tags }}
          labels: ${{ steps.meta-init.outputs.labels }}
          cache-from: type=gha,scope=init
          cache-to: type=gha,mode=max,scope=init

  # Trigger the dockhand stack redeploy once both images are on GHCR. Runs only
  # for pushes to main — tag builds are for manual sha-pinning, and a fork/PR has
  # no access to the secrets anyway.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dockhand deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "DOCKHAND_WEBHOOK_URL / DOCKHAND_WEBHOOK_SECRET not set — skipping deploy." >&2
            exit 1
          fi
          # dockhand verifies GitHub-style: X-Hub-Signature-256 = sha256=<HMAC-SHA256
          # of the raw request body, keyed by the webhook secret>. Sign a small JSON
          # body; the secret itself is never sent.
          body='{"ref":"${{ github.ref }}","sha":"${{ github.sha }}","source":"build-images"}'
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 300 \
            -X POST "$WEBHOOK_URL" \
            -H "X-Hub-Signature-256: $sig" \
            -H 'Content-Type: application/json' \
            --data "$body")
          echo "HTTP $code"; cat response.json; echo
          [ "$code" = "200" ] || { echo "dockhand webhook failed" >&2; exit 1; }
